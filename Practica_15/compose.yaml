services:
  postgres:
    image: postgres:16
    container_name: practica15-postgres
    environment:
      POSTGRES_DB: pharmacy
      POSTGRES_USER: lab15
      POSTGRES_PASSWORD: lab15pass
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pharmacy15_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab15 -d pharmacy"]
      interval: 3s
      retries: 15
volumes:
  pharmacy15_data:
