services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy
      POSTGRES_DB: pharmacy_db
    ports:
      - "5432:5432"
    volumes:
      - pharmacy_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy -d pharmacy_db"]
      interval: 3s
      retries: 15
volumes:
  pharmacy_data:
