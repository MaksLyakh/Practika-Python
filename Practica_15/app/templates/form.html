{% extends 'base.html' %}{% block title %}{{'Редактирование' if item else 'Добавление'}}{% endblock %}{% block content %}<a class="back" href="{{url_for('web.medicines')}}">← Каталог</a><div class="panel form-panel"><span class="eyebrow">УПРАВЛЕНИЕ КАТАЛОГОМ</span><h1>{{'Редактирование препарата' if item else 'Новый препарат'}}</h1><form method="post"><label>Название<input name="name" maxlength="160" required value="{{request.form.get('name',item.name if item else '')}}"></label><label>Категория<select name="category_id" required>{% for c in categories %}<option value="{{c.id}}" {% if (request.form.get('category_id',item.category_id if item else 0)|int)==c.id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></label><div class="fields"><label>Цена, ₽<input type="number" name="price" min="0.01" step="0.01" required value="{{request.form.get('price',item.price if item else '')}}"></label><label>Остаток, шт.<input type="number" name="stock" min="0" required value="{{request.form.get('stock',item.stock if item else 0)}}"></label></div><button class="button">Сохранить</button></form></div>{% endblock %}
